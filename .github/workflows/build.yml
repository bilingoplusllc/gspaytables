name: Build and check

# Эта линия НИЧЕГО НЕ ВЫКЛАДЫВАЕТ и не хранит ни одного секрета.
#
# Раньше здесь стояли два шага wrangler с секретом CLOUDFLARE_API_TOKEN. От них
# отказались сознательно, и вот почему.
#
# Первое: настоящая частота публикации — раз в год. Ставки General Schedule
# меняются в конце декабря, всё остальное время данные те же. Ежемесячный
# прогон нужен не ради выкладки, а чтобы ЗАМЕТИТЬ, что источник изменился или
# умер. Для этого креденшл не нужен.
#
# Второе: автоматическая выкладка в день, когда у источника поменялась форма
# данных, — это ровно то, чего не хочется без присмотра. Публикация раз в год
# руками с проверкой живого ответа лучше, чем ежемесячный тихий деплой.
#
# Третье: репозиторий публичный, а долгоживущий токен с правами на аккаунт
# Cloudflare в нём — постоянный риск ради действия, которое случается раз в
# год. Альтернатива (нативная интеграция Cloudflare Pages с GitHub) просит
# приложение с правом ЗАПИСИ в репозиторий, то есть меняет право поменьше на
# право побольше.
#
# Публикация: `npx wrangler pages deploy dist --project-name=gspaytables`
# с машины, где wrangler авторизован по OAuth, затем обязательно
# `python pipeline/verify_live.py` — сверка отданного с собранным побайтово.

on:
  schedule:
    # OPM публикует таблицы следующего года в конце декабря, BEA обновляет
    # индексы цен там же. Ежемесячный прогон существует ради этих двух недель;
    # в остальные месяцы он подтверждает, что источники ещё живы.
    - cron: "10 5 6 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - ".github/workflows/build.yml"

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Версия закреплена намеренно: в коде есть места, где разница между
          # 3.11 и 3.12 меняет не поведение, а сам разбор файла (f-строки по
          # PEP 701 — на 3.11 это SyntaxError, а не другое поведение).
          python-version: "3.12"

      # Зависимостей нет: только стандартная библиотека.
      - name: Fetch OPM and BEA data
        run: python pipeline/fetch.py

      - name: Parse pay tables
        run: python pipeline/parse.py

      - name: Build locality definitions
        run: python pipeline/localities.py

      - name: Map localities to price data
        run: python pipeline/rpp.py

      - name: Build ZIP-to-locality bridge
        run: python pipeline/zips.py

      # render.py падает, если год в данных не совпадает с годом издания.
      # Именно этот шаг и есть смысл ежемесячного прогона: в январе он станет
      # красным, пока не появятся таблицы нового года.
      - name: Render site
        run: python pipeline/render.py

      # Гейты внутри render.py смотрят на смысл страниц. Этот шаг — вторая,
      # независимая линия: он ничего не знает о питоне и проверяет каталог как
      # есть. Если render.py однажды тихо перестанет что-то проверять, здесь
      # всё равно останется рубеж.
      - name: Sanity check
        run: |
          COUNT=$(find dist -name index.html | wc -l)
          echo "страниц собрано: $COUNT"
          if [ "$COUNT" -lt 95 ]; then
            echo "::error::Слишком мало страниц ($COUNT) — прогон остановлен"
            exit 1
          fi

          # Языковой шлюз. 2026-08-12 на соседнем проекте русский текст уехал
          # на все 321 страницу, и все структурные проверки были зелёными.
          CYR=$(grep -rlP '[\x{0400}-\x{04FF}]' dist | wc -l)
          if [ "$CYR" -gt 0 ]; then
            echo "::error::Кириллица на $CYR страницах"
            grep -rlP '[\x{0400}-\x{04FF}]' dist | head -5
            exit 1
          fi

          # Дисклеймер обязателен на каждой странице: сайт о федеральных
          # зарплатах без явного «мы не OPM» — это риск по правилу FTC
          # об имперсонации госоргана, а не вопрос вежливости.
          NODISC=$(grep -rL "not affiliated with" dist --include="*.html" | wc -l)
          if [ "$NODISC" -gt 0 ]; then
            echo "::error::Дисклеймер отсутствует на $NODISC страницах"
            grep -rL "not affiliated with" dist --include="*.html" | head -5
            exit 1
          fi

          # Год издания. Дублирует гейт внутри render.py намеренно: молчаливый
          # откат на прошлогодние таблицы — самый дорогой отказ этого сайта,
          # и он должен ловиться обеими линиями.
          YEAR=$(date -u +%Y)
          NOYEAR=$(grep -rL "$YEAR" dist --include="index.html" | wc -l)
          if [ "$NOYEAR" -gt 0 ]; then
            echo "::error::Год $YEAR отсутствует на $NOYEAR страницах"
            grep -rL "$YEAR" dist --include="index.html" | head -5
            exit 1
          fi

          # Файл индексов подгружается инструментом по запросу: без него
          # поиск зоны по индексу молча перестанет работать.
          [ -s dist/zip-zone.json ] || { echo "::error::нет файла индексов"; exit 1; }
          for f in dist/404.html dist/index.html dist/privacy/index.html \
                   dist/locality/rest-of-u-s/index.html dist/gs-12/index.html \
                   dist/calculator/index.html dist/compare/index.html; do
            [ -s "$f" ] || { echo "::error::нет файла $f"; exit 1; }
          done
          echo "независимая проверка пройдена"

      # Собранный сайт остаётся артефактом прогона: если январский прогон
      # покажет новые данные, публиковать можно ровно то, что здесь проверено,
      # не пересобирая заново на другой машине.
      - name: Keep the built site as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 30

  # GitHub молча отключает cron после 60 дней без активности в репозитории.
  # Ежемесячный коммит этого не допускает. Пишется встроенным GITHUB_TOKEN —
  # он выдаётся автоматически, создавать и хранить ничего не нужно.
  keepalive:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name "gspaytables-bot"
          git config user.email "hello@gspaytables.com"
          git add .keepalive
          git diff --staged --quiet || git commit -m "chore: keepalive"
          git push
